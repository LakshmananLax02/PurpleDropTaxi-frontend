<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5815b7" />
    <title>You are offline | PurpleDropTaxi</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #270755, #5815b7 58%, #1bc5d8); color: #fff; font-family: Arial, sans-serif; }
      main { max-width: 440px; text-align: center; }
      .mark { width: 76px; height: 76px; margin: 0 auto 24px; border: 4px solid #fff; border-radius: 25px; display: grid; place-items: center; font-size: 44px; font-weight: 900; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); }
      p { margin: 16px 0 0; color: rgba(255,255,255,.84); font-size: 17px; line-height: 1.55; }
      button { margin-top: 28px; border: 0; border-radius: 999px; background: #fff; color: #5815b7; padding: 13px 22px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>You are offline</h1>
      <p>Please reconnect to continue booking your PurpleDropTaxi ride. Your previously visited pages may still be available.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
